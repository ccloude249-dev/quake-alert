<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QUAKE ALERT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0c1119; }
  @keyframes qaPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  ::-webkit-scrollbar { width: 0; }
  @media (max-width: 520px) {
    .qa-mobile-page { padding: 0 !important; display: block !important; }
    .qa-phone-wrap { transform: none !important; margin: 0 !important; width: 100% !important; }
    .qa-phone-wrap > * { width: 100% !important; min-width: 0 !important; max-width: 100% !important; }
  }
</style>
</helmet>
<div class="qa-mobile-page" style="min-height:100vh; width:100%; background:radial-gradient(90% 60% at 50% 0%, rgba(34,211,238,0.06), transparent 60%), #0c1119; font-family:'IBM Plex Sans',sans-serif; display:flex; flex-direction:column; align-items:center; padding:48px 24px 64px;">

  <div class="qa-phone-wrap" style="display:flex; justify-content:center; width:100%;">
  <x-import component="IOSDevice" from="./ios-frame.jsx" dark="{{ darkOn }}" hint-size="402px,874px">
    <div style="height:874px; background:linear-gradient(180deg,#0c1320,#0a0f18); display:flex; flex-direction:column;">

      <div style="padding:60px 20px 16px; border-bottom:1px solid rgba(120,160,200,0.1); display:flex; align-items:center; gap:13px; background:rgba(8,13,22,0.6);">
        <div style="width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,#22d3ee,#0e7490); display:flex; align-items:center; justify-content:center; font-size:22px; color:#06141a; box-shadow:0 0 20px rgba(34,211,238,0.4);">✦</div>
        <div style="flex:1;">
          <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; color:#fff;">Asistente QUAKE ALERT</div>
          <div style="display:flex; align-items:center; gap:7px; margin-top:2px;"><span style="width:7px; height:7px; border-radius:50%; background:#20c997;"></span><span style="font-size:13px; color:#9fb4ad;">En línea · Inteligencia de emergencias</span></div>
        </div>
      </div>

      <div ref="{{ chatRef }}" style="flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:12px;">
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="2">
          <div style="display:flex; justify-content:{{ m.align }};">
            <div style="max-width:80%; padding:13px 16px; border-radius:18px; background:{{ m.bg }}; border:1px solid {{ m.border }}; color:{{ m.color }}; font-size:15px; line-height:1.5;">{{ m.text }}</div>
          </div>
        </sc-for>
      </div>

      <div style="padding:14px 16px 10px; border-top:1px solid rgba(120,160,200,0.1);">
        <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; color:#5f7187; margin-bottom:10px;">SUGERENCIAS</div>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="3">
            <button onClick="{{ s.onAsk }}" style="border:1px solid rgba(34,211,238,0.3); cursor:pointer; padding:9px 14px; border-radius:999px; background:rgba(34,211,238,0.08); color:#bfe9f4; font-family:'IBM Plex Sans',sans-serif; font-size:13px;">{{ s.label }}</button>
          </sc-for>
        </div>
      </div>

      <div style="padding:6px 16px 30px; display:flex; align-items:center; gap:10px;">
        <div style="flex:1; height:44px; border-radius:22px; background:rgba(255,255,255,0.05); border:1px solid rgba(120,160,200,0.16); display:flex; align-items:center; padding:0 18px; font-size:15px; color:#5f7187;">Escribe un mensaje…</div>
        <div style="width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#22d3ee,#0e7490); display:flex; align-items:center; justify-content:center; font-size:18px; color:#06141a;">↑</div>
      </div>
    </div>
  </x-import>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 880, &quot;height&quot;: 1000}}">
class Component extends DCLogic {
  QA = {
    sismo: ['¿Qué hago durante un sismo?', 'Agáchate, cúbrete bajo una mesa firme y sujétate. Aléjate de ventanas y objetos altos. No uses elevadores ni corras hacia las salidas hasta que termine la sacudida.'],
    familia: ['¿Dónde está mi familia?', 'Tu red familiar está mayormente a salvo: Mamá (Casa) y Sofía (Colegio) confirmaron "Estoy bien". Diego sigue en tránsito — te aviso en cuanto confirme su estado.'],
    ruta: ['¿Cuál es mi ruta de evacuación?', 'Tu punto seguro más cercano es el Parque Central, a 240 m. Sal por la puerta norte, evita la 6a avenida (semáforos caídos) y sigue las flechas verdes hasta el punto de reunión.'],
    mochila: ['¿Qué llevo en mi mochila de emergencia?', 'Lleva: agua para 3 días, linterna, botiquín, copia de documentos, silbato, cargador portátil y algo de efectivo. Te marqué los faltantes en tu lista de preparación.'],
    reportar: ['Quiero reportar un daño', 'Entendido. Comparte tu ubicación y una foto del daño; lo enviaré de inmediato a Protección Civil con tu nivel de prioridad. ¿Hay personas atrapadas o heridas?'],
  };

  ORDER = ['sismo', 'familia', 'ruta', 'mochila', 'reportar'];

  chatRef = React.createRef();

  componentDidUpdate() {
    const el = this.chatRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }

  state = {
    messages: [
      { role: 'bot', text: 'Hola Ana. Soy tu asistente de emergencias. Estoy monitoreando tu zona y puedo guiarte paso a paso. ¿En qué te ayudo?' },
    ],
    asked: [],
  };

  ask(key) {
    const [q, a] = this.QA[key];
    this.setState(s => ({
      messages: [...s.messages, { role: 'me', text: q }, { role: 'bot', text: a }],
      asked: [...s.asked, key],
    }));
  }

  renderVals() {
    const messages = this.state.messages.map(m => {
      const me = m.role === 'me';
      return {
        text: m.text,
        align: me ? 'flex-end' : 'flex-start',
        bg: me ? 'rgba(34,211,238,0.16)' : 'rgba(20,30,48,0.8)',
        border: me ? 'rgba(34,211,238,0.3)' : 'rgba(120,160,200,0.14)',
        color: me ? '#eaf1f8' : '#eaf1f8',
      };
    });

    const suggestions = this.ORDER
      .filter(k => !this.state.asked.includes(k))
      .map(k => ({ label: this.QA[k][0], onAsk: () => this.ask(k) }));

    return { darkOn: true, messages, suggestions, chatRef: this.chatRef };
  }
}
</script>
</body>
</html>
