<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #060a12; }
  a { text-decoration: none; }
  @keyframes qaRing { 0% { transform: scale(0.15); opacity: 0.85; } 100% { transform: scale(1.05); opacity: 0; } }
  @keyframes qaBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,160,200,0.2); border-radius: 4px; }
</style>
</helmet>
<div style="height:100vh; width:100%; overflow:hidden; font-family:'IBM Plex Sans',sans-serif; color:#eaf1f8; background:#070c14; display:grid; grid-template-columns:300px 1fr;">

  <aside style="border-right:1px solid rgba(120,160,200,0.1); background:#080d16; display:flex; flex-direction:column; overflow:hidden;">
    <div style="padding:22px 22px 18px; border-bottom:1px solid rgba(120,160,200,0.1);">
      <div style="display:flex; align-items:center; gap:11px;">
        <div style="width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#22d3ee,#0e7490); display:flex; align-items:center; justify-content:center; font-size:16px; color:#06141a;">◉</div>
        <div>
          <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; color:#fff;">Recorrido guiado</div>
          <div style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#7b8ca3; margin-top:1px;">QUAKE ALERT · {{ total }} PARADAS</div>
        </div>
      </div>
      <div style="margin-top:16px; height:5px; border-radius:3px; background:rgba(255,255,255,0.06); overflow:hidden;"><div style="height:100%; border-radius:3px; background:linear-gradient(90deg,#22d3ee,#20c997); width:{{ progress }}; transition:width 0.4s ease;"></div></div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7b8ca3; margin-top:8px;">PARADA {{ stepNum }} / {{ total }}</div>
    </div>
    <div style="flex:1; overflow-y:auto; padding:12px;">
      <sc-for list="{{ rail }}" as="r" hint-placeholder-count="17">
        <div onClick="{{ r.onJump }}" style="display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:10px; cursor:pointer; background:{{ r.bg }}; border:1px solid {{ r.border }}; margin-bottom:4px;">
          <span style="width:24px; height:24px; border-radius:7px; background:{{ r.numBg }}; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:{{ r.numColor }}; flex-shrink:0;">{{ r.n }}</span>
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; color:{{ r.titleColor }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ r.title }}</div>
            <div style="font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.08em; color:#5f7187;">{{ r.persona }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </aside>

  <main style="position:relative; overflow:hidden; display:flex; flex-direction:column;">
    <div style="position:absolute; inset:0; background-image:linear-gradient(rgba(120,160,200,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,200,0.04) 1px,transparent 1px); background-size:60px 60px; mask-image:radial-gradient(90% 90% at 70% 10%,#000,transparent 78%); pointer-events:none;"></div>
    <div style="position:absolute; top:-90px; right:-60px; width:420px; height:420px; pointer-events:none;">
      <div style="position:absolute; inset:0; border:1px solid rgba(34,211,238,0.16); border-radius:50%; animation:qaRing 4.5s ease-out infinite;"></div>
      <div style="position:absolute; inset:0; border:1px solid rgba(34,211,238,0.16); border-radius:50%; animation:qaRing 4.5s ease-out infinite 1.5s;"></div>
      <div style="position:absolute; inset:0; border:1px solid rgba(34,211,238,0.16); border-radius:50%; animation:qaRing 4.5s ease-out infinite 3s;"></div>
    </div>

    <div style="position:relative; flex:1; overflow-y:auto; padding:54px 60px;">
      <div style="max-width:760px;">
        <div style="display:inline-flex; align-items:center; gap:9px; padding:7px 15px; border-radius:999px; background:{{ chipBg }}; border:1px solid {{ chipBorder }}; margin-bottom:24px;">
          <span style="width:7px; height:7px; border-radius:50%; background:{{ chipDot }}; animation:qaBlink 2s infinite;"></span>
          <span style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.16em; color:{{ chipDot }};">{{ personaLabel }}</span>
        </div>
        <div style="display:flex; align-items:baseline; gap:16px;">
          <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; color:rgba(120,160,200,0.4);">{{ stepPad }}</span>
          <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:46px; line-height:1.05; letter-spacing:-0.02em; margin:0;">{{ title }}</h1>
        </div>
        <p style="font-size:19px; color:#aebfd4; line-height:1.6; margin:22px 0 34px; max-width:680px;">{{ narr }}</p>

        <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.16em; color:#22d3ee; margin-bottom:16px;">QUÉ MOSTRAR AQUÍ</div>
        <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:38px;">
          <sc-for list="{{ demo }}" as="d" hint-placeholder-count="3">
            <div style="display:flex; gap:14px; align-items:flex-start; background:rgba(20,30,48,0.5); border:1px solid rgba(120,160,200,0.14); border-radius:13px; padding:16px 18px;">
              <span style="color:#22d3ee; font-size:16px; margin-top:1px;">▸</span>
              <span style="font-size:16px; color:#cdd9e8; line-height:1.5;">{{ d }}</span>
            </div>
          </sc-for>
        </div>

        <a href="{{ fileUrl }}" style="display:inline-flex; align-items:center; gap:10px; padding:15px 30px; border-radius:13px; background:linear-gradient(135deg,#22d3ee,#0e7490); color:#06141a; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; box-shadow:0 10px 28px rgba(34,211,238,0.28);">Abrir esta pantalla →</a>
      </div>
    </div>

    <div style="position:relative; border-top:1px solid rgba(120,160,200,0.1); background:rgba(8,13,22,0.7); padding:18px 60px; display:flex; align-items:center; justify-content:space-between;">
      <button onClick="{{ prev }}" style="border:1px solid rgba(120,160,200,0.25); cursor:pointer; padding:12px 24px; border-radius:11px; background:{{ prevBg }}; color:{{ prevColor }}; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;">← Anterior</button>
      <span style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:#7b8ca3;">{{ railHint }}</span>
      <button onClick="{{ next }}" style="border:none; cursor:pointer; padding:12px 26px; border-radius:11px; background:linear-gradient(135deg,#22d3ee,#0e7490); color:#06141a; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;">{{ nextLabel }}</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  STEPS = [
    { persona: 'PÚBLICO', color: '#22d3ee', title: 'Landing page', file: 'Quake Alert Landing.dc.html',
      narr: 'El primer contacto con QUAKE ALERT. Una portada de clase mundial que comunica la promesa: segundos que salvan vidas.',
      demo: ['Hero con la cuenta regresiva y efectos sísmicos en vivo', 'Secciones: cómo funciona, soluciones, precios y FAQ', 'Botones que llevan a registro e inicio de sesión'] },
    { persona: 'ACCESO', color: '#22d3ee', title: 'Autenticación web', file: 'Quake Alert Auth Web.dc.html',
      narr: 'El ingreso a la plataforma desde el navegador, multilingüe y seguro.',
      demo: ['Bienvenida → login → registro → recuperar contraseña', 'Doble factor (2FA) que entra de verdad a la plataforma', 'Selector de idioma ES / PT / EN'] },
    { persona: 'ACCESO', color: '#22d3ee', title: 'Autenticación móvil', file: 'Quake Alert Auth Mobile.dc.html',
      narr: 'El mismo acceso en el teléfono (Ionic), con biometría para entrar en un toque.',
      demo: ['Login con Face ID / huella (escaneo animado)', 'Registro, recuperar y 2FA en marco de teléfono', 'Multilingüe ES / PT / EN'] },
    { persona: 'CIUDADANO', color: '#20c997', title: 'App ciudadana', file: 'Quake Alert App.dc.html',
      narr: 'El corazón del producto: la experiencia que vive una persona cuando la tierra tiembla.',
      demo: ['Pulsa "Simular alerta" → cuenta regresiva en vivo', 'Sismo en curso → ¿Estás bien? → estado a la familia', 'Navegación entre Inicio, Familia, Asistente y Mapa'] },
    { persona: 'CIUDADANO', color: '#20c997', title: 'Asistente IA', file: 'Quake Alert Assistant.dc.html',
      narr: 'Inteligencia conversacional que guía paso a paso durante la emergencia.',
      demo: ['Toca una sugerencia para conversar', 'Respuestas con instrucciones claras', 'Localiza familia y reporta daños'] },
    { persona: 'CIUDADANO', color: '#20c997', title: 'Asistentes de voz', file: 'Quake Alert Voice.dc.html',
      narr: 'El hogar habla solo: Alexa, Google y Siri anuncian la alerta automáticamente.',
      demo: ['Pulsa "Simular anuncio" → escena de voz con onda', 'El anuncio se difunde a los altavoces', 'Integración con los tres asistentes'] },
    { persona: 'CIUDADANO', color: '#20c997', title: 'Onboarding QuakeBox', file: 'Quake Alert Onboarding.dc.html',
      narr: 'Alta de un sensor casero en cuatro pasos simples.',
      demo: ['Asistente paso a paso (conectar → buscar → ubicar → listo)', 'Barra de progreso superior', 'Confirmación de sensor en línea'] },
    { persona: 'HOGAR', color: '#f5a623', title: 'Smart Home', file: 'Quake Alert Smart Home.dc.html',
      narr: 'La alerta actúa sobre el mundo físico del hogar, sin intervención humana.',
      demo: ['Pulsa "Simular sismo" → protocolo automático', 'Corta gas, abre puertas, enciende luces y sirena', 'Estados de dispositivos cambian en vivo'] },
    { persona: 'GOBIERNO', color: '#22d3ee', title: 'GIS Command Center', file: 'Quake Alert Command Center.dc.html',
      narr: 'La sala de control nacional para protección civil: ve todo el país en tiempo real.',
      demo: ['Conmuta las capas (sensores, alertas, instituciones)', '"Simular evento" enciende el mapa con epicentro', 'KPIs nacionales y bitácora de alertas'] },
    { persona: 'GOBIERNO', color: '#22d3ee', title: 'Smart City municipal', file: 'Quake Alert Smart City.dc.html',
      narr: 'Infraestructura urbana de emergencia para municipalidades.',
      demo: ['"Activar alerta municipal" enciende la ciudad', 'Toggles de sirenas públicas con ondas', 'Paneles LED y botones de pánico'] },
    { persona: 'INTELIGENCIA', color: '#22d3ee', title: 'Analytics & BI', file: 'Quake Alert Analytics.dc.html',
      narr: 'Inteligencia operativa: métricas, cobertura y tendencias de la red.',
      demo: ['Selector de período 7d / 30d / 12m cambia los datos', 'Gráficos de barras, dona y línea', 'Ranking de municipios por cobertura'] },
    { persona: 'INTELIGENCIA', color: '#22d3ee', title: 'Simulacros con IA', file: 'Quake Alert Drills.dc.html',
      narr: 'Entrena a un país entero con simulacros inteligentes medibles.',
      demo: ['"Iniciar simulacro" → fase en vivo (evacuación 78%)', 'Coordinador IA reasigna brigadas', 'Resultados con score 94 y certificación'] },
    { persona: 'INSTITUCIONES', color: '#20c997', title: 'Protección Corporativa', file: 'Quake Alert Corporate.dc.html',
      narr: 'Continuidad operativa multi-sede para bancos, hospitales y escuelas.',
      demo: ['Filtros por sector', '"Simular alerta regional" marca sedes expuestas', 'Estado por sede (operativa / evacuando / crítico)'] },
    { persona: 'CATÁLOGOS', color: '#22d3ee', title: 'Constructor de Formularios', file: 'Quake Alert Form Builder.dc.html',
      narr: 'Cualquier catálogo se arma arrastrando campos: formularios 100% dinámicos.',
      demo: ['Arrastra o haz clic en campos al lienzo', 'Edita propiedades y reordena', 'Vista previa en vivo + definición JSON'] },
    { persona: 'INTEGRACIÓN', color: '#22d3ee', title: 'Low-Code Studio', file: 'Quake Alert Studio.dc.html',
      narr: 'Automatizaciones y flujos sin programar: alerta → respuesta.',
      demo: ['"Probar flujo" ejecuta el workflow', 'Activa / desactiva acciones del flujo', 'Registro de ejecución paso a paso'] },
    { persona: 'DESARROLLADORES', color: '#22d3ee', title: 'Plataforma & Integraciones', file: 'Quake Alert Integration Hub.dc.html',
      narr: 'La guía para que el implementador sepa exactamente qué conectar y cómo.',
      demo: ['8 manuales: QuakeBox, voz, IoT, GIS, auth, pagos, API', 'Cada uno con pasos, endpoints y checklist', 'Accesos directos a las opciones principales'] },
    { persona: 'VISIÓN', color: '#22d3ee', title: 'Deck de Visión', file: 'Quake Alert Vision.dc.html',
      narr: 'El panorama completo en 17 slides: problema, plataforma, negocio y roadmap.',
      demo: ['Navega los slides con flechas o miniaturas', 'Notas de orador en cada slide', 'Ideal para inversores y gobierno'] },
  ];

  state = { i: 0 };

  go(i) { this.setState({ i: Math.max(0, Math.min(this.STEPS.length - 1, i)) }); }

  renderVals() {
    const n = this.STEPS.length;
    const i = this.state.i;
    const s = this.STEPS[i];
    const pad = (x) => String(x + 1).padStart(2, '0');

    const rail = this.STEPS.map((st, idx) => {
      const on = idx === i;
      const done = idx < i;
      return {
        n: pad(idx), title: st.title, persona: st.persona,
        onJump: () => this.go(idx),
        bg: on ? 'rgba(34,211,238,0.12)' : 'transparent',
        border: on ? 'rgba(34,211,238,0.3)' : 'transparent',
        numBg: on ? 'rgba(34,211,238,0.22)' : (done ? 'rgba(32,201,151,0.18)' : 'rgba(255,255,255,0.04)'),
        numColor: on ? '#22d3ee' : (done ? '#20c997' : '#7b8ca3'),
        titleColor: on ? '#fff' : '#cdd9e8',
      };
    });

    const last = i === n - 1;
    return {
      total: n, stepNum: i + 1, stepPad: pad(i), progress: Math.round(((i + 1) / n) * 100) + '%',
      rail,
      personaLabel: s.persona, title: s.title, narr: s.narr, demo: s.demo,
      fileUrl: encodeURI(s.file),
      chipDot: s.color,
      chipBg: 'rgba(34,211,238,0.08)', chipBorder: 'rgba(34,211,238,0.25)',
      prev: () => this.go(i - 1), next: () => this.go(last ? 0 : i + 1),
      nextLabel: last ? 'Reiniciar recorrido ↺' : 'Siguiente →',
      prevBg: i === 0 ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.05)',
      prevColor: i === 0 ? '#5f7187' : '#eaf1f8',
      railHint: 'Usa el panel izquierdo para saltar a cualquier parada',
    };
  }
}
</script>
</body>
</html>
