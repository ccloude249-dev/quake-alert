<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="qa-start" content="https://TU-APP.herokuapp.com/app">
<meta name="theme-color" content="#070c14">
<title>Sin conexión</title>
<style>
  html, body { margin: 0; height: 100%; background: #070c14; color: #eaf1f8; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 28px; text-align: center; }
  small { font: 11px ui-monospace, monospace; letter-spacing: .25em; color: #f5a623; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p { margin: 0; max-width: 320px; color: #9fb4ad; font-size: 14px; line-height: 1.5; }
  button { margin-top: 10px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #22d3ee; color: #06141a; font-size: 15px; font-weight: 700; }
</style>
</head>
<body>
<small>SIN CONEXIÓN</small>
<h1>No se pudo abrir el servidor</h1>
<p>La vigilancia en segundo plano sigue activa y suena si ya tenías la alarma armada. Revisá tu conexión para abrir la app.</p>
<button onclick="location.replace(document.querySelector('meta[name=qa-start]').content)">Reintentar</button>
</body>
</html>
